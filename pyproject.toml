[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "qf-lib"
dynamic = ["version"]
description = "Quantitative Finance Library"
readme = "README.md"
requires-python = ">=3.13,<3.16"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jacek Witkowski"},
    {name = "Marcin Borratynski"},
    {name = "Thomas Ruxton"},
    {name = "Dominik Picheta"},
    {name = "Olga Kalinowska"},
    {name = "Karolina Cynk"},
    {name = "Jakub Czerski"},
    {name = "Bartlomiej Czajewski"},
    {name = "Zeynep Gültuğ Aydemir"},
    {name = "Octavian-Mihai Matei"},
    {name = "Eirik Thorp Eythorsson"},
    {name = "Marek Bais"},
]
keywords = ["quantitative", "finance", "backtester", "trading", "algorithmic-trading"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pandas>=3.0.6",
    "xarray>=2026.9.0",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "Pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
    "WeasyPrint>=70.0",
    "Jinja2>=3.1.6",
]

[project.optional-dependencies]
documentation = [
    "autodocsumm>=0.2.15",
    "pydata-sphinx-theme>=0.23.0",
    "myst-parser>=5.1.0",
    "sphinx-copybutton>=0.5.2",
    "Sphinx>=9.1.0",
    "docutils>=0.22.4,<0.23",
    "markupsafe>=3.0.4",
]
interactive_brokers = [
    "ibapi>=9.81.1.post1",
]
bloomberg_beap_hapi = [
    "PyJWT>=2.15.1",
    "retrying>=1.4.2",
    # "beap-lib>=0.0.1",  # Not available in PyPI - install manually if needed
    "requests>=2.34.2",
]
bloomberg_dl = ["cryptography>=50.0.2", "fastparquet>=2026.9.0", "oauthlib>=4.0.0", "PyJWT>=2.15.1", "retrying>=1.4.2", "requests-oauthlib>=2.0.0", "urllib3>=2.8.0"]
blpapi = [
    "blpapi>=3.26.9.1",
]
quandl = [
    "quandl>=3.7.0",
]
yfinance = [
    "yfinance>=1.7.0",
]
detailed_analysis = [
    "statsmodels>=0.15.0",
    "scipy>=1.18.1",
    "cvxopt>=1.3.3",
    "arch>=8.0.0",
]
alpaca = [
    "alpaca-py>=0.44.0",
    "websockets>=13.1,<14",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "pyright>=1.1.414",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://quarkfin.github.io/qf-lib-info"
Documentation = "https://qf-lib.readthedocs.io"
Repository = "https://github.com/quarkfin/qf-lib"
"Bug Tracker" = "https://github.com/quarkfin/qf-lib/issues"

[tool.hatch.version]
# Use regex to extract version from _version.py file
# This avoids issues with VCS detection in nested git repositories
path = "src/qf_lib/_version.py"
pattern = "__version__ = version = '(?P<version>[^']+)'"

[tool.hatch.build.targets.wheel]
packages = ["src/qf_lib"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qf_lib/**",
    "demo_scripts/**",
    "vendor/**",
    "uv.lock",
    ".python-version",
    "input/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "src/qf_lib/tests/**",
    "docs/**",
    ".git*",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["qf_lib"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["src/qf_lib/tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"


[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = true

[tool.uv.sources]
blpapi = { index = "bloomberg" }
yfinance = { path = "vendor/yfinance" }
