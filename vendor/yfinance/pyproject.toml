[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "yfinance"
version = "1.7.0+ayu1"
requires-python = ">=3.13"
license-files = ["LICENSE.txt"]
dependencies = ["beautifulsoup4>=4.11.1", "curl_cffi>=0.15", "lxml>=4.9.0", "multitasking>=0.0.7", "numpy>=1.16.5", "pandas>=1.3.0", "peewee>=3.16.2", "platformdirs>=2.0.0", "protobuf>=3.19.0", "pytz>=2022.5", "requests>=2.31", "websockets>=13.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/yfinance"]
