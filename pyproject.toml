[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qf-lib"
dynamic = ["version"]
description = "Quantitative Finance Library"
readme = "README.md"
requires-python = "==3.13.*"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jacek Witkowski"},
    {name = "Marcin Borratynski"},
    {name = "Thomas Ruxton"},
    {name = "Dominik Picheta"},
    {name = "Olga Kalinowska"},
    {name = "Karolina Cynk"},
    {name = "Jakub Czerski"},
    {name = "Bartlomiej Czajewski"},
    {name = "Zeynep Gültuğ Aydemir"},
    {name = "Octavian-Mihai Matei"},
    {name = "Eirik Thorp Eythorsson"},
    {name = "Marek Bais"},
]
keywords = ["quantitative", "finance", "backtester", "trading", "algorithmic-trading"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pandas>=2.3.3",
    "xarray>=2025.1.2",
    "numpy>=2.3.4",
    "matplotlib>=3.10.7",
    "Pillow>=12.0.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
    "WeasyPrint>=63.1",
    "Jinja2>=3.1.6",
]

[project.optional-dependencies]
documentation = [
    "autodocsumm>=0.2.14",
    "sphinx-rtd-theme>=3.0.2",
    "Sphinx>=8.1.3",
    "docutils>=0.21.2",
    "markupsafe>=3.0.3",
]
interactive_brokers = [
    "ibapi>=9.81.1",
]
bloomberg_beap_hapi = [
    "PyJWT>=2.10.1",
    "retrying>=1.3.4",
    # "beap-lib>=0.0.1",  # Not available in PyPI - install manually if needed
    "requests>=2.32.5",
]
blpapi = [
    # "blpapi>=3.24.4",  # Not available in PyPI - install manually from Bloomberg if needed
]
quandl = [
    "quandl>=3.7.0",
]
yfinance = [
    "yfinance>=0.2.55",
]
detailed_analysis = [
    "statsmodels>=0.14.5",
    "scipy>=1.16.3",
    "cvxopt>=1.3.2",
    "arch>=7.2.0",
]
alpaca = [
    "alpaca-py>=0.37.0",
]
[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "pyright>=1.1.400",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://quarkfin.github.io/qf-lib-info"
Documentation = "https://qf-lib.readthedocs.io"
Repository = "https://github.com/quarkfin/qf-lib"
"Bug Tracker" = "https://github.com/quarkfin/qf-lib/issues"

[tool.hatch.version]
# Use regex to extract version from _version.py file
# This avoids issues with VCS detection in nested git repositories
path = "src/qf_lib/_version.py"
pattern = "__version__ = version = '(?P<version>[^']+)'"

[tool.hatch.build.targets.wheel]
packages = ["src/qf_lib"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qf_lib/**",
    "demo_scripts/**",
    "input/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "src/qf_lib/tests/**",
    "docs/**",
    ".git*",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["qf_lib"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["src/qf_lib/tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

